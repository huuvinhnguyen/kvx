name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Flutter 3.41.9 bundles Dart 3.11.5, matching pubspec.yaml.
  FLUTTER_VERSION: '3.41.9'

jobs:
  flutter:
    name: Flutter analyze, tests and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kvx_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Record toolchain
        run: |
          flutter --version
          dart --version
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check isolated smoke tooling
        run: python3 ../tool/test_relay_smoke_support.py
      - name: Analyze
        run: flutter analyze
      - name: Run unit and widget tests
        run: flutter test --reporter expanded
      - name: Build Web
        run: flutter build web
      - name: Verify dependency files unchanged
        if: always()
        run: git -C .. diff --exit-code -- kvx_flutter/pubspec.yaml kvx_flutter/pubspec.lock

  ios:
    name: Flutter iOS simulator build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kvx_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Record toolchain
        run: |
          flutter --version
          dart --version
          xcodebuild -version
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build iOS simulator
        run: flutter build ios --simulator --no-codesign
      - name: Prepare isolated relay demo
        timeout-minutes: 5
        run: bash ../tool/run_relay_demo_smoke.sh prepare
      - name: Build relay demo test app
        timeout-minutes: 15
        run: bash ../tool/run_relay_demo_smoke.sh build
      - name: Boot selected iPhone Simulator
        timeout-minutes: 12
        run: bash ../tool/run_relay_demo_smoke.sh boot
      - name: Exercise prebuilt relay demo
        timeout-minutes: 8
        run: bash ../tool/run_relay_demo_smoke.sh drive
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-demo-simulator-evidence
          path: ${{ runner.temp }}/relay-demo-artifacts
          if-no-files-found: error
          retention-days: 7
      - name: Verify dependency files unchanged
        if: always()
        run: git -C .. diff --exit-code -- kvx_flutter/pubspec.yaml kvx_flutter/pubspec.lock
